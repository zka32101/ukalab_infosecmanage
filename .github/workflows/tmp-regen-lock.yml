name: tmp-regen-lock
on:
  push:
    branches: [chore/ci-flutter-3.47]
    paths: ['.github/workflows/tmp-regen-lock.yml']
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
      - run: flutter pub get
      - run: git diff --stat pubspec.lock; git diff pubspec.lock
      - name: commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git diff --cached --quiet || (git commit -m "chore: regenerate pubspec.lock for Flutter 3.47.8 (CI)" && git push)
